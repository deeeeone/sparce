name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Sparce.app
        run: ./scripts/bundle.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Sparce.app Sparce.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sparce
          path: build/Sparce.zip
